<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="discGradient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a1a2f"/>
      <stop offset="55%" stop-color="#0d2b4e"/>
      <stop offset="100%" stop-color="#040b14"/>
    </radialGradient>

    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#2f8bff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>

    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5be7ff"/>
      <stop offset="100%" stop-color="#8f7dff"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#020509"/>

  <!-- faint background grid, techy feel -->
  <g stroke="#123049" stroke-width="1" opacity="0.5">
    <path d="M0 64 H512 M0 128 H512 M0 192 H512 M0 256 H512 M0 320 H512 M0 384 H512 M0 448 H512"/>
    <path d="M64 0 V512 M128 0 V512 M192 0 V512 M256 0 V512 M320 0 V512 M384 0 V512 M448 0 V512"/>
  </g>

  <!-- orbit rings suggesting data streams around the disc -->
  <g fill="none" stroke="url(#ringGradient)" opacity="0.55">
    <ellipse cx="256" cy="196" rx="205" ry="60" stroke-width="1.5" transform="rotate(-8 256 196)"/>
    <ellipse cx="256" cy="196" rx="230" ry="80" stroke-width="1" opacity="0.4" transform="rotate(6 256 196)"/>
  </g>

  <!-- Blu-ray disc -->
  <g filter="url(#glow)">
    <circle cx="256" cy="196" r="150" fill="url(#discGradient)" stroke="url(#ringGradient)" stroke-width="4"/>
    <circle cx="256" cy="196" r="118" fill="none" stroke="#1a3a5c" stroke-width="1.5" opacity="0.8"/>
    <circle cx="256" cy="196" r="88" fill="none" stroke="#1a3a5c" stroke-width="1.5" opacity="0.6"/>
    <circle cx="256" cy="196" r="34" fill="#040b14" stroke="url(#ringGradient)" stroke-width="3"/>
    <circle cx="256" cy="196" r="10" fill="#00e5ff"/>
  </g>

  <!-- readout laser beam -->
  <path d="M256 196 L256 40" stroke="url(#beamGradient)" stroke-width="6" filter="url(#glow)"/>

  <!-- circuit-style traces linking the disc to data nodes -->
  <g stroke="url(#ringGradient)" stroke-width="2.5" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M110 196 H50 V150"/>
    <path d="M402 196 H462 V242"/>
    <path d="M256 346 V400 H340"/>
    <path d="M180 320 L130 380"/>
    <path d="M332 320 L382 372"/>
  </g>
  <g fill="#00e5ff">
    <circle cx="50" cy="150" r="5"/>
    <circle cx="462" cy="242" r="5"/>
    <circle cx="340" cy="400" r="5"/>
    <circle cx="130" cy="380" r="5"/>
    <circle cx="382" cy="372" r="5"/>
  </g>

  <!-- BRTS wordmark -->
  <text x="256" y="470" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif" font-size="72" font-weight="700" letter-spacing="10" fill="url(#textGradient)" filter="url(#glow)">BRTS</text>
  <text x="256" y="494" text-anchor="middle" font-family="'Segoe UI', 'Arial', sans-serif" font-size="14" letter-spacing="6" fill="#5be7ff" opacity="0.85">BLU-RAY TOOLS SUITE</text>
</svg>
