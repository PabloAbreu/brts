# all properties should be defined here (even with bogus values)
# to serve as documentation for the user

# Startup ASCII banner printed on stderr by the CLI entry point.
brts.cli.banner=true
# how to invoke the CLI from the command line 
# used in script generation
brts.command=brts

index.bdmv.contentProviderName=BRTS authoring
tsmuxer.binary=/please/define/path/to/tsMuxeR
pgs.render.fontName=SansSerif
pgs.render.fontSize=48
pgs.render.fontColor=0xFFFFFFFF
pgs.render.outlineColor=0xFF000000
pgs.render.outlineWidth=3.0
pgs.render.verticalPositionRatio=0.90
pgs.render.horizontalMargin=120

textStyle.fontName=SansSerif
textStyle.fallbackFontName=Dialog
textStyle.fontSize=28
textStyle.fontStyle=1
textStyle.normalColor=#FFFFFFFF
textStyle.selectedColor=#FFFFD700
textStyle.activatedColor=#FFFF6600
textStyle.shadow=false
textStyle.shadowColor=#80000000
textStyle.outline=false
textStyle.outlineColor=#FF000000
textStyle.outlineWidth=2.0
textStyle.backgroundShape=NONE
textStyle.backgroundColor=#80000000
textStyle.backgroundAlpha=128
textStyle.cornerRadius=12
textStyle.paddingX=16
textStyle.paddingY=8

# Title-menu layout defaults. Descriptor values override these settings.
titleMenu.layout.type=TEXT_LIST
titleMenu.layout.textListColumns=1
titleMenu.layout.thumbnailGridColumns=2
titleMenu.layout.marginTop=100
titleMenu.layout.marginBottom=100
titleMenu.layout.marginLeft=80
titleMenu.layout.marginRight=80
titleMenu.layout.spacingX=40
titleMenu.layout.spacingY=60
titleMenu.layout.thumbnailWidth=320
titleMenu.layout.thumbnailHeight=180
titleMenu.layout.thumbnailDurationSec=5.0
titleMenu.layout.showLabels=true
titleMenu.layout.maxButtonWidthRatio=0.75

i18n.default.language=eng

# Composition engine to use for image compositing operations.
# Valid values: java2d (default, uses Java2D Graphics2D), opencv (uses OpenCV warpAffine with INTER_AREA)
# to use openCV, you have to build with -DenableOpenCV because the OpenCV dependency
# is too big to be included by default.
brts.composition.engine=java2d
# two-step resize and compose (true) or single-step compose (false, default)
brts.composition.twoStep=false

# MKV demuxer strategy.
# Valid values: jebml (pure-Java demuxer), ffmpeg (bytedeco/FFmpeg demuxer), tsmuxer (external tsMuxeR CLI)
# tsmuxer strategy reuses tsmuxer.binary to resolve the CLI path.
brts.mkv.demuxer=jebml

# Optional timeout for tsMuxeR MKV demux in milliseconds.
brts.mkv.tsmuxer.timeout.ms=120000

# Chapter thumbnail extraction defaults.
# height=0 means derive the height from the source aspect ratio.
brts.thumbnail.width=240
brts.thumbnail.height=0
# Minimum mean luminance difference between adjacent pixels, from 0 to 255.
# set it to zero to disable the minimum luminance variation check
# this is used to determine if a captured thumbnail has enough contrast to be considered valid
brts.thumbnail.minimumLuminanceVariation=20.0
