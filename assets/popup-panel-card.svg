<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Dark slate gradient background for maximum text contrast -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070e1c" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0b172a" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#040810" stop-opacity="0.96" />
    </linearGradient>

    <!-- Top and bottom glow accent -->
    <linearGradient id="edgeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle radial glow behind button content -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Base chamfered card rectangle -->
  <polygon points="20,0 780,0 800,20 800,380 780,400 20,400 0,380 0,20" fill="url(#cardBg)" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.6" />

  <!-- Center subtle illumination -->
  <polygon points="20,0 780,0 800,20 800,380 780,400 20,400 0,380 0,20" fill="url(#centerGlow)" />

  <!-- Outer frame border with glowing edges -->
  <line x1="40" y1="0" x2="760" y2="0" stroke="url(#edgeGlow)" stroke-width="3" />
  <line x1="40" y1="400" x2="760" y2="400" stroke="url(#edgeGlow)" stroke-width="3" />

  <!-- Corner bracket accents (Top-Left) -->
  <polyline points="0,40 0,20 20,0 40,0" fill="none" stroke="#26ffe6" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="20" cy="20" r="3" fill="#00f0ff" />

  <!-- Corner bracket accents (Top-Right) -->
  <polyline points="760,0 780,0 800,20 800,40" fill="none" stroke="#26ffe6" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="780" cy="20" r="3" fill="#00f0ff" />

  <!-- Corner bracket accents (Bottom-Right) -->
  <polyline points="800,360 800,380 780,400 760,400" fill="none" stroke="#26ffe6" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="780" cy="380" r="3" fill="#00f0ff" />

  <!-- Corner bracket accents (Bottom-Left) -->
  <polyline points="40,400 20,400 0,380 0,360" fill="none" stroke="#26ffe6" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="20" cy="380" r="3" fill="#00f0ff" />

  <!-- Side tech indicators -->
  <g fill="#00e5ff" fill-opacity="0.7">
    <rect x="6" y="100" width="3" height="24" />
    <rect x="6" y="130" width="3" height="12" />
    <rect x="791" y="100" width="3" height="24" />
    <rect x="791" y="130" width="3" height="12" />
  </g>
</svg>
