<#-- Rendered as a FreeMarker template: width/height are supplied by PopupMenuBackgroundRenderer.
     9-slice layout: corner = fixed-size corner zone; sides stretch along one axis; center stretches on both. -->
<#assign corner = 45>
<#assign chamfer = 30>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" preserveAspectRatio="none">
  <defs>
    <!-- Background vertical gradient: dark high-contrast translucent backdrop -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a14" stop-opacity="0.94" />
      <stop offset="30%" stop-color="#0a1324" stop-opacity="0.88" />
      <stop offset="70%" stop-color="#081020" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#03060c" stop-opacity="0.96" />
    </linearGradient>

    <!-- Top edge glowing accent gradient -->
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.0" />
      <stop offset="10%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#26ffe6" stop-opacity="1.0" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#26ffe6" stop-opacity="1.0" />
      <stop offset="90%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Tech stripe pattern for HUD texture -->
    <pattern id="techStripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.06" />
    </pattern>

    <!-- Subtle horizontal glow gradient -->
    <linearGradient id="barGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Main HUD panel polygon with chamfered top corners (fixed-size corner cut, stretchable straight edges) -->
  <polygon points="0,${chamfer} ${chamfer},0 ${width - chamfer},0 ${width},${chamfer} ${width},${height} 0,${height}" fill="url(#bgGrad)" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Diagonal tech stripe texture layer -->
  <polygon points="0,${chamfer} ${chamfer},0 ${width - chamfer},0 ${width},${chamfer} ${width},${height} 0,${height}" fill="url(#techStripes)" />

  <!-- Top side zone (constant height = corner, stretches horizontally between the two top corners) -->
  <rect x="${corner}" y="0" width="${width - 2 * corner}" height="3" fill="url(#topGlow)" />
  <rect x="${corner}" y="3" width="${width - 2 * corner}" height="12" fill="url(#barGlow)" />

  <!-- Top-left corner zone (constant size, anchored to the corner) -->
  <polyline points="2,${corner} 2,${chamfer - 2} ${chamfer - 2},2 ${corner},2" fill="none" stroke="#26ffe6" stroke-width="3" stroke-linecap="round" />
  <circle cx="${chamfer - 2}" cy="${chamfer - 2}" r="3" fill="#00e5ff" />

  <!-- Top-right corner zone (constant size, anchored to the corner) -->
  <polyline points="${width - 2},${corner} ${width - 2},${chamfer - 2} ${width - (chamfer - 2)},2 ${width - corner},2" fill="none" stroke="#26ffe6" stroke-width="3" stroke-linecap="round" />
  <circle cx="${width - (chamfer - 2)}" cy="${chamfer - 2}" r="3" fill="#00e5ff" />

  <!-- Left side zone (constant width = corner, fixed-offset tick marks anchored to the left edge) -->
  <g stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="70" y1="18" x2="130" y2="18" />
    <line x1="70" y1="14" x2="70" y2="22" />
    <line x1="90" y1="15" x2="90" y2="21" />
    <line x1="110" y1="15" x2="110" y2="21" />
    <line x1="130" y1="14" x2="130" y2="22" />
  </g>

  <!-- Right side zone (constant width = corner, fixed-offset tick marks anchored to the right edge) -->
  <g stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="${width - 130}" y1="18" x2="${width - 70}" y2="18" />
    <line x1="${width - 70}" y1="14" x2="${width - 70}" y2="22" />
    <line x1="${width - 90}" y1="15" x2="${width - 90}" y2="21" />
    <line x1="${width - 110}" y1="15" x2="${width - 110}" y2="21" />
    <line x1="${width - 130}" y1="14" x2="${width - 130}" y2="22" />
  </g>

  <!-- Bottom side zone (constant height = corner, stretches horizontally; boundary line spans full width) -->
  <line x1="0" y1="${height - 2}" x2="${width}" y2="${height - 2}" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.3" />
</svg>
