<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Static title menu screen background for the sci-fi style template (same palette as the popup HUD panels). -->
  <defs>
    <radialGradient id="spaceGlow" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="45%" stop-color="#0a1324" />
      <stop offset="80%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.05" />
    </pattern>

    <pattern id="techStripes" width="24" height="24" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.05" />
    </pattern>

    <linearGradient id="hGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.0" />
      <stop offset="15%" stop-color="#00e5ff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#26ffe6" stop-opacity="1.0" />
      <stop offset="85%" stop-color="#00e5ff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="barFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a14" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#0a1324" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#03060c" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1920" height="1080" fill="url(#spaceGlow)" />
  <rect width="1920" height="1080" fill="url(#grid)" />

  <!-- Decorative orbit rings on the right side -->
  <g fill="none" stroke="#00e5ff">
    <circle cx="1480" cy="540" r="320" stroke-width="1.5" stroke-opacity="0.12" />
    <circle cx="1480" cy="540" r="250" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="6 14" />
    <circle cx="1480" cy="540" r="180" stroke-width="2" stroke-opacity="0.10" />
    <path d="M 1160 540 A 320 320 0 0 1 1480 220" stroke="#26ffe6" stroke-width="3" stroke-opacity="0.45" />
    <path d="M 1800 540 A 320 320 0 0 1 1480 860" stroke="#26ffe6" stroke-width="3" stroke-opacity="0.45" />
    <circle cx="1480" cy="220" r="5" fill="#00f0ff" />
    <circle cx="1480" cy="860" r="5" fill="#00f0ff" />
      <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 1480 540"
      to="360 1480 540"
      dur="30s"
      repeatCount="indefinite" />
  </g>

  <!-- Main content panel on the left, where the title buttons are laid out -->
  <polygon points="120,210 160,170 1000,170 1040,210 1040,870 1000,910 160,910 120,870" fill="url(#panelGrad)" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5" />
  <polygon points="120,210 160,170 1000,170 1040,210 1040,870 1000,910 160,910 120,870" fill="url(#techStripes)" />
  <rect x="200" y="170" width="760" height="3" fill="url(#hGlow)" />
  <rect x="200" y="173" width="760" height="14" fill="url(#barFade)" />
  <rect x="200" y="907" width="760" height="3" fill="url(#hGlow)" />

  <!-- Panel corner accents -->
  <g fill="none" stroke="#26ffe6" stroke-width="3.5" stroke-linecap="round">
    <polyline points="120,250 120,210 160,170 200,170" />
    <polyline points="960,170 1000,170 1040,210 1040,250" />
    <polyline points="1040,830 1040,870 1000,910 960,910" />
    <polyline points="200,910 160,910 120,870 120,830" />
  </g>
  <g fill="#00f0ff">
    <circle cx="160" cy="170" r="3" />
    <circle cx="1000" cy="170" r="3" />
    <circle cx="1000" cy="910" r="3" />
    <circle cx="160" cy="910" r="3" />
  </g>

  <!-- Screen frame: chamfered HUD border hugging the safe area -->
  <polygon points="40,90 90,40 1830,40 1880,90 1880,990 1830,1040 90,1040 40,990" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.35" />
  <rect x="140" y="40" width="1640" height="2" fill="url(#hGlow)" opacity="0.8" />
  <rect x="140" y="1038" width="1640" height="2" fill="url(#hGlow)" opacity="0.8" />
  <g fill="none" stroke="#26ffe6" stroke-width="3" stroke-linecap="round">
    <polyline points="40,140 40,90 90,40 140,40" />
    <polyline points="1780,40 1830,40 1880,90 1880,140" />
    <polyline points="1880,940 1880,990 1830,1040 1780,1040" />
    <polyline points="140,1040 90,1040 40,990 40,940" />
  </g>

  <!-- Tick-mark rulers -->
  <g stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="1180" y1="80" x2="1780" y2="80" />
    <line x1="1180" y1="72" x2="1180" y2="88" />
    <line x1="1330" y1="75" x2="1330" y2="85" />
    <line x1="1480" y1="72" x2="1480" y2="88" />
    <line x1="1630" y1="75" x2="1630" y2="85" />
    <line x1="1780" y1="72" x2="1780" y2="88" />
    <line x1="140" y1="1000" x2="740" y2="1000" />
    <line x1="140" y1="992" x2="140" y2="1008" />
    <line x1="290" y1="995" x2="290" y2="1005" />
    <line x1="440" y1="992" x2="440" y2="1008" />
    <line x1="590" y1="995" x2="590" y2="1005" />
    <line x1="740" y1="992" x2="740" y2="1008" />
  </g>

  <!-- Side status bars -->
  <g fill="#00e5ff">
    <rect x="1848" y="420" width="4" height="60" fill-opacity="0.7" />
    <rect x="1848" y="490" width="4" height="30" fill-opacity="0.45" />
    <rect x="1848" y="530" width="4" height="15" fill-opacity="0.25" />
    <rect x="68" y="535" width="4" height="15" fill-opacity="0.25" />
    <rect x="68" y="560" width="4" height="30" fill-opacity="0.45" />
    <rect x="68" y="600" width="4" height="60" fill-opacity="0.7" />
  </g>
</svg>
